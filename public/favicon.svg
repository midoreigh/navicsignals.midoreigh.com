<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <rect width="64" height="64" rx="16" fill="#070c1e" />
  <circle cx="32" cy="32" r="28" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Radar circles -->
  <circle cx="32" cy="32" r="20" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 3" />
  <circle cx="32" cy="32" r="10" stroke="#0ea5e9" stroke-opacity="0.5" stroke-width="1" />
  
  <!-- Crosshairs -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1" />

  <!-- Satellite Body -->
  <circle cx="32" cy="32" r="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="32" cy="32" r="2.5" fill="#f8fafc" />

  <!-- Solar Panels -->
  <!-- Left Panel -->
  <rect x="12" y="28" width="12" height="8" rx="1.5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" />
  <line x1="16" y1="28" x2="16" y2="36" stroke="#60a5fa" stroke-width="0.8" />
  <line x1="20" y1="28" x2="20" y2="36" stroke="#60a5fa" stroke-width="0.8" />
  <line x1="24" y1="32" x2="26" y2="32" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Right Panel -->
  <rect x="40" y="28" width="12" height="8" rx="1.5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" />
  <line x1="44" y1="28" x2="44" y2="36" stroke="#60a5fa" stroke-width="0.8" />
  <line x1="48" y1="28" x2="48" y2="36" stroke="#60a5fa" stroke-width="0.8" />
  <line x1="38" y1="32" x2="40" y2="32" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Saffron Antenna Pulse -->
  <path d="M 28 20 Q 32 16 36 20" stroke="#FF9933" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M 25 15 Q 32 10 39 15" stroke="#FF9933" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
